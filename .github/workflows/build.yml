name: Build
on:
  pull_request:
  push:
  workflow_call:
    inputs:
      publish:
        description: Publish artifacts to Modrinth?
        required: false
        type: boolean
        default: false
    secrets:
      MODRINTH_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Build
        run: ./gradlew buildAndCollect
      - name: Capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: Publish versions to Modrinth
        if: inputs.publish == true
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew chiseledPublishModrinth --no-configuration-cache
